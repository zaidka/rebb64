# C64 PRG linker config

FEATURES {
    STARTADDRESS: default = $0400;
}

SYMBOLS {
    __LOADADDR__: type = export, value = $0400;

    # =======================================================================
    # VIC Bank Layout - Single source of truth
    # =======================================================================
    # All VIC-dependent addresses are derived from __VIC_BANK_BASE__.
    # Assembly code imports these in src/master.s.
    # To relocate the VIC bank, change __VIC_BANK_BASE__ and adjust offsets.

    # --- Primary addresses ---
    __VIC_BANK_BASE__:     type = export, value = $4000;
    __VIC_CHARSET_A__:     type = export, value = __VIC_BANK_BASE__ + $0000;
    __VIC_CHARSET_EXT__:   type = export, value = __VIC_CHARSET_A__ + $0400;
    __VIC_CHARSET_B__:     type = export, value = __VIC_BANK_BASE__ + $0800;
    __VIC_SCREEN_A__:      type = export, value = __VIC_BANK_BASE__ + $1000;
    __VIC_SCREEN_B__:      type = export, value = __VIC_BANK_BASE__ + $1400;
    __VIC_SPRITES_START__: type = export, value = __VIC_BANK_BASE__ + $1800;

    # Screen backup buffer (title music at load time, overwritten during gameplay).
    # Outside the VIC bank; offset from __VIC_BANK_BASE__ is just arithmetic convenience.
    __SCREEN_BACKUP__:     type = export, value = __VIC_BANK_BASE__ + $4B00;

    # --- CIA2 Port A values ---
    # Bits 1:0 select VIC bank (inverted): %11=Bank 0, %10=Bank 1, %01=Bank 2, %00=Bank 3
    __VIC_BANK_BITS__:     type = export, value = 3 - __VIC_BANK_BASE__ / $4000;
    # Gameplay: serial bus config ($94) + bank bits. Using + since low 2 bits of $94 are clear.
    __CIA2_PRA_GAME__:     type = export, value = $94 + __VIC_BANK_BITS__;
    # Init/loader return: always bank 0 ($C4 + %11 = $C7)
    __CIA2_PRA_INIT__:     type = export, value = $C7;

    # --- VIC_MEMPTR ($D018) register values ---
    # Bits 7-4 = screen offset/$400, Bits 3-1 = charset offset/$800
    # Using * instead of << and + instead of | (cfg only supports +-*/)
    __VIC_MEMPTR_INIT__: type = export, value =
        ((__VIC_CHARSET_B__ - __VIC_BANK_BASE__) / $400) * 16 +
        ((__VIC_CHARSET_A__ - __VIC_BANK_BASE__) / $800) * 2;
    __VIC_MEMPTR_A__:    type = export, value =
        ((__VIC_SCREEN_A__ - __VIC_BANK_BASE__) / $400) * 16 +
        ((__VIC_CHARSET_A__ - __VIC_BANK_BASE__) / $800) * 2;
    __VIC_MEMPTR_B__:    type = export, value =
        ((__VIC_SCREEN_B__ - __VIC_BANK_BASE__) / $400) * 16 +
        ((__VIC_CHARSET_B__ - __VIC_BANK_BASE__) / $800) * 2;

    # --- Sprite pointer base ---
    __SPRITE_PTR_BASE__: type = export, value =
        (__VIC_SPRITES_START__ - __VIC_BANK_BASE__) / 64;
}

MEMORY {
    LOADADDR: file = %O, start = $0400 - 2, size = 2;
    MAIN:     file = %O, start = $0400, size = $FC00;
}

SEGMENTS {
    LOADADDR:      load = LOADADDR, type = ro;

    CODE:          load = MAIN, type = rw;
    CHARSET:       load = MAIN, type = ro, start = __VIC_CHARSET_A__;
    CHARSET_EXT:   load = MAIN, type = ro, start = __VIC_CHARSET_EXT__;
    CODE_4460:     load = MAIN, type = rw;
    CHARSET_B:     load = MAIN, type = rw, start = __VIC_CHARSET_B__;
    WORK_RAM:      load = MAIN, type = ro;
    SCREEN_RAM:    load = MAIN, type = ro, start = __VIC_SCREEN_A__;
    SPRITES_GAME:  load = MAIN, type = ro, start = __VIC_SPRITES_START__;
    MUSICSEQ:      load = MAIN, type = ro;
    MUSICHANDLERS: load = MAIN, type = rw;
    LEVELS2_SPR1:  load = MAIN, type = ro;
    LEVELS2_CODE1: load = MAIN, type = rw;
    LEVELS2_SPR2:  load = MAIN, type = ro;
    LEVELS2_CODE2: load = MAIN, type = rw;
    BUBBLE_MASKS:  load = MAIN, type = ro;
    SPRITES2_PREAMBLE: load = MAIN, type = ro;
    SPRITES2_TABLES: load = MAIN, type = ro, align = $100;
    # SCREEN_BUFFER contains title music data at load time. During gameplay
    # the underlying memory ($8B00-$8EFF) is overwritten as a screen backup
    # buffer, accessed via fixed addresses derived from __SCREEN_BACKUP__.
    SCREEN_BUFFER: load = MAIN, type = rw, start = __SCREEN_BACKUP__;
    SOFTWARE_SPRITES: load = MAIN, type = ro;
    BONUS_CAKE:    load = MAIN, type = ro;
    GAMEINIT1:     load = MAIN, type = rw;
    BONUS_MELON:   load = MAIN, type = ro;
    BONUS_DIAMOND: load = MAIN, type = ro;
    GAMEINIT2:     load = MAIN, type = rw;
    GT_ASM1:       load = MAIN, type = ro;
    GT_BIN1:       load = MAIN, type = ro;
    GT_ASM2:       load = MAIN, type = ro;
    GT_BIN2:       load = MAIN, type = ro;
    GT_ASM3:       load = MAIN, type = ro;
    ENEMY_SPAWNS:  load = MAIN, type = ro;
    ITEM_POSITIONS: load = MAIN, type = ro;
    GAMEDATA_WIND: load = MAIN, type = ro;
    SIDEBARS:      load = MAIN, type = ro;
    LEVEL_TILES:   load = MAIN, type = ro;
    PHYSICS_FLAGS: load = MAIN, type = ro;
    LEVEL_BITMAPS: load = MAIN, type = ro;
    CODE_LEVEL_RENDERER: load = MAIN, type = rw;
    CODE_SPRITES_DISPLAY: load = MAIN, type = rw;
    CODE_LINE_DRAW:    load = MAIN, type = rw;
    CODE_SPRITE_COMPOSER: load = MAIN, type = rw;
    CODE_ENTITY:       load = MAIN, type = rw;
    CODE_TITLE_DATA:   load = MAIN, type = rw;
    CODE_CREDITS:      load = MAIN, type = rw;
    MUSICPTRS:     load = MAIN, type = ro, align = $10;
    MUSICTABLES:   load = MAIN, type = ro;
    CODE_F2C4:     load = MAIN, type = rw;
    MUSICFREQS:    load = MAIN, type = ro;
    CODE_F4BD:     load = MAIN, type = rw;
    SFXMUSIC:      load = MAIN, type = ro;
    CODE_FE00:     load = MAIN, type = rw;
    HUDFONT:       load = MAIN, type = ro;
    LEVEL_COLORS:  load = MAIN, type = ro;
    LEVEL_FLAGS:   load = MAIN, type = ro;
    FILE_PADDING:  load = MAIN, type = ro;
}

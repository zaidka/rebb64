# C64 PRG linker config
# Segment positions defined via start= (absolute address) or offset= (relative to MAIN)

FEATURES {
    STARTADDRESS: default = $0400;
}

SYMBOLS {
    __LOADADDR__: type = export, value = $0400;
}

MEMORY {
    LOADADDR: file = %O, start = $0400 - 2, size = 2;
    MAIN:     file = %O, start = $0400, size = $FC00;
}

SEGMENTS {
    LOADADDR:      load = LOADADDR, type = ro;

    # Code segments use start= for absolute addressing
    # Data segments use offset= (can be changed to relocate binary data)
    CODE:          load = MAIN, type = rw, start = $0400;
    CHARSET:       load = MAIN, type = ro, start = $4000;
    CODE_4460:     load = MAIN, type = rw, start = $4460;
    CODE_4800:     load = MAIN, type = rw, start = $4800;
    GRAPHICS:      load = MAIN, type = ro, offset = $4B00 - $0400;
    SPRITES1:      load = MAIN, type = ro, offset = $5800 - $0400;
    LEVELS:        load = MAIN, type = ro, offset = $6000 - $0400;
    MUSICHANDLERS: load = MAIN, type = rw, start = $7305;
    LEVELS2:       load = MAIN, type = ro, offset = $7440 - $0400;
    SPRITES2:      load = MAIN, type = ro, offset = $8000 - $0400;
    SPRITES3:      load = MAIN, type = ro, offset = $A000 - $0400;
    GAMEINIT1:     load = MAIN, type = rw, start = $A428;
    SPRPAT:        load = MAIN, type = ro, offset = $A47E - $0400;
    GAMEINIT2:     load = MAIN, type = rw, start = $A5A0;
    GAMETABLES:    load = MAIN, type = ro, offset = $A632 - $0400;
    GAMEDATA:      load = MAIN, type = ro, offset = $B0F0 - $0400;
    LEVEL_BITMAPS: load = MAIN, type = ro, start = $C5F2;
    CODE_E000:     load = MAIN, type = rw, start = $E000;
    MUSICTABLES:   load = MAIN, type = ro, offset = $F240 - $0400;
    CODE_F2C4:     load = MAIN, type = rw, start = $F2C4;
    MUSICFREQS:    load = MAIN, type = ro, offset = $F39C - $0400;
    CODE_F4BD:     load = MAIN, type = rw, start = $F4BD;
    SFXMUSIC:      load = MAIN, type = ro, offset = $F922 - $0400;
    CODE_FE00:     load = MAIN, type = rw, start = $FE00;
    HUDFONT:       load = MAIN, type = ro, start = $FE90;
    LEVEL_COLORS:  load = MAIN, type = ro, start = $FF30;
    LEVEL_FLAGS:   load = MAIN, type = ro, start = $FF94;
    FILE_PADDING:  load = MAIN, type = ro, start = $FFF8;
}

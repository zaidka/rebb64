# C64 PRG linker config
# Segment positions defined via start= (absolute address) or offset= (relative to MAIN)

FEATURES {
    STARTADDRESS: default = $0400;
}

SYMBOLS {
    __LOADADDR__: type = export, value = $0400;
}

MEMORY {
    LOADADDR: file = %O, start = $0400 - 2, size = 2;
    MAIN:     file = %O, start = $0400, size = $FC00;
}

SEGMENTS {
    LOADADDR:      load = LOADADDR, type = ro;

    CODE:          load = MAIN, type = rw;
    # CHARSET is at $4000 (VIC Bank 1 base + $0000 offset)
    # Could be relocated to any $800-aligned address within a VIC bank,
    # but would require updating: CIA2_PRA, VIC_MEMPTR values, and backup copy destination
    CHARSET:       load = MAIN, type = ro, start = $4000;
    CODE_4460:     load = MAIN, type = rw;
    CODE_4800:     load = MAIN, type = rw;
    GRAPHICS:      load = MAIN, type = ro;
    SPRITES_GAME:  load = MAIN, type = ro;
    MUSICSEQ:      load = MAIN, type = ro;
    MUSICHANDLERS: load = MAIN, type = rw;
    LEVELS2_SPR1:  load = MAIN, type = ro;
    LEVELS2_CODE1: load = MAIN, type = rw;
    LEVELS2_SPR2:  load = MAIN, type = ro;
    LEVELS2_CODE2: load = MAIN, type = rw;
    BUBBLE_MASKS:  load = MAIN, type = ro;
    SPRITES2_TABLES: load = MAIN, type = ro;
    SOFTWARE_SPRITES: load = MAIN, type = ro;
    BONUS_CAKE:    load = MAIN, type = ro;
    GAMEINIT1:     load = MAIN, type = rw;
    BONUS_MELON:   load = MAIN, type = ro;
    BONUS_DIAMOND: load = MAIN, type = ro;
    GAMEINIT2:     load = MAIN, type = rw;
    GAMETABLES:    load = MAIN, type = ro;
    ENEMY_SPAWNS:  load = MAIN, type = ro;
    ITEM_POSITIONS: load = MAIN, type = ro;
    GAMEDATA_WIND: load = MAIN, type = ro;
    SIDEBARS:      load = MAIN, type = ro;
    LEVEL_TILES:   load = MAIN, type = ro;
    PHYSICS_FLAGS: load = MAIN, type = ro;
    LEVEL_BITMAPS: load = MAIN, type = ro;
    CODE_E000:     load = MAIN, type = rw;
    MUSICTABLES:   load = MAIN, type = ro;
    CODE_F2C4:     load = MAIN, type = rw;
    MUSICFREQS:    load = MAIN, type = ro;
    CODE_F4BD:     load = MAIN, type = rw;
    SFXMUSIC:      load = MAIN, type = ro;
    CODE_FE00:     load = MAIN, type = rw;
    HUDFONT:       load = MAIN, type = ro;
    LEVEL_COLORS:  load = MAIN, type = ro;
    LEVEL_FLAGS:   load = MAIN, type = ro;
    FILE_PADDING:  load = MAIN, type = ro;
}
